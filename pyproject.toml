[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sodacookie-server"
version = "0.1.0"
description = "FastAPI integration server for the SodaCookie MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 캠프가 준 것은 OpenAI 호환 게이트웨이다 (ai/gateway.py). anthropic 은
    # ai/adapters.py 의 직접 호출 경로용이라 남겨 둔다 — 키를 따로 받으면 그대로 쓴다.
    "anthropic==1.7.0",
    "openai==3.16.2",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests", "server/tests"]
